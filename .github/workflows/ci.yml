name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
      - name: Set up Python
        run: uv python install
      - name: Install Python package and C++ extension
        run: |
          uv sync --locked
          uv run --locked python --version
      - name: Build C++
        run: |
          uv run cmake --preset release
          uv run cmake --build --preset release --parallel
      - name: Run native GoogleTest cases through CTest
        run: ctest --preset release
      - name: Test Python and native pipeline
        run: uv run --locked pytest -q
      - name: Run command-line smoke experiment
        run: |
          uv run --locked dmm generate --config configs/dataset_smoke.yaml
          uv run --locked dmm bench --config configs/benchmark_smoke.yaml
          uv run --locked dmm analyze --input results/benchmark_smoke.csv
